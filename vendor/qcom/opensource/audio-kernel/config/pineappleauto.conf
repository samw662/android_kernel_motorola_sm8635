# The external module build and the resolved kernel config supply these
# selectors. Translate selected modules to the defines used by audio sources.
PINEAPPLE_AUDIO_CONFIGS := SND_SOC_PINEAPPLE SND_SOC_WSA884X SND_SOC_WSA883X \
	SND_SOC_WCD9XXX_V2 SND_SOC_WCD937X SND_SOC_WCD937X_SLAVE \
	SND_SOC_WCD938X SND_SOC_WCD938X_SLAVE SND_SOC_WCD939X \
	SND_SOC_WCD939X_SLAVE SND_SOC_WCD_MBHC SND_SWR_HAPTICS \
	SND_SOC_MSM_STUB SND_SOC_MSM_HDMI_CODEC_RX SND_SOC_SWR_DMIC
CDEFINES += $(foreach cfg,$(PINEAPPLE_AUDIO_CONFIGS),$(if $(filter y m,$(CONFIG_$(cfg))),-DCONFIG_$(cfg)=1))
